<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>第十夜 - The Tenth Night</title>
<script src="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/js/all.min.js"></script>
<link href="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/css/fontawesome.min.css" rel="stylesheet"/>
<script src="https://image.uc.cn/s/uae/g/3n/mos-production/0915/3.4.17.js"></script>
<style>
    /* 样式与最终版相同，此处省略以保持简洁，实际使用时请复制完整样式 */
    :root {
        --bg-color: #121212;
        --panel-bg: #1e1e1e;
        --accent-gold: #ffd700;
        --accent-red: #ff4444;
        --accent-blue: #4488ff;
        --text-main: #e0e0e0;
        --text-dim: #888;
        --grid-border: #333;
    }
    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: auto;
        touch-action: manipulation;
        margin: 0;
        padding: 0;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .game-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(12, 1fr);
        gap: 1px;
        background-color: var(--grid-border);
        border: 2px solid var(--grid-border);
        aspect-ratio: 1 / 1;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
    }
    .cell {
        background-color: #000;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: background-color 0.3s ease, opacity 0.2s ease;
    }
    .cell.fog { background-color: #1a1a1a; }
    .cell.fog::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,1) 100%);
    }
    .cell.revealed { 
        background-color: #2a2a2a;
        animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; background-color: #000; }
        to { opacity: 1; background-color: #2a2a2a; }
    }
    .cell.highlight-move {
        box-shadow: inset 0 0 0 2px #4caf50, 0 0 5px #4caf50;
        z-index: 2;
    }
    .cell.current {
        background-color: #556655;
        box-shadow: inset 0 0 10px var(--accent-gold);
    }
    .cell.end-zone {
        background-color: #332200;
        border: 1px dashed var(--accent-gold);
    }
    .team-stats {
        display: flex;
        gap: 8px;
        padding: 8px;
        background: var(--panel-bg);
        border-bottom: 1px solid #333;
        overflow-x: auto;
        flex-shrink: 0;
    }
    .char-card {
        flex: 1;
        min-width: 100px;
        background: #2a2a2a;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-left: 3px solid transparent;
        position: relative;
    }
    .char-card.player { border-left-color: var(--accent-gold); }
    .char-card.ally { border-left-color: #888; }
    .char-card.dead { opacity: 0.5; filter: grayscale(1); }
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .share-bread-btn {
        background: #333;
        border: none;
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.7rem;
        margin-top: 4px;
        cursor: pointer;
    }
    .share-bread-btn:active { transform: scale(0.95); }
    .log-container {
        flex: 1;
        background: #151515;
        padding: 10px;
        overflow-y: auto;
        font-size: 0.9rem;
        border-top: 1px solid #333;
        display: flex;
        flex-direction: column;
    }
    .log-entry {
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid #222;
        line-height: 1.4;
    }
    .log-entry.highlight { color: var(--accent-gold); }
    .log-entry.danger { color: var(--accent-red); }
    .log-entry.info { color: var(--accent-blue); }
    .control-panel {
        padding: 10px;
        background: var(--panel-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .btn {
        background: #333;
        color: white;
        border: 1px solid #555;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: var(--accent-gold); color: #000; border: none; }
